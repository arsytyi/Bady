name: Release

# Push a tag like v0.6.0 (matching lib/version.dart) to publish a signed APK
# on the repository's Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          app=$(sed -n "s/^const appVersion = '\(.*\)';/\1/p" lib/version.dart)
          test "${GITHUB_REF_NAME}" = "v$app" || { echo "tag ${GITHUB_REF_NAME} != v$app"; exit 1; }

      - name: Require the release signing key
        env:
          BADY_KEYSTORE_BASE64: ${{ secrets.BADY_KEYSTORE_BASE64 }}
        run: test -n "$BADY_KEYSTORE_BASE64" || { echo "Signing secrets are missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        env:
          BADY_KEYSTORE_BASE64: ${{ secrets.BADY_KEYSTORE_BASE64 }}
          BADY_KEYSTORE_PASSWORD: ${{ secrets.BADY_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-number=$(( $(date +%s) / 60 ))
          cp build/app/outputs/flutter-apk/app-release.apk "bady-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "bady-${GITHUB_REF_NAME}.apk" \
            --title "Bady ${GITHUB_REF_NAME#v}" --generate-notes
